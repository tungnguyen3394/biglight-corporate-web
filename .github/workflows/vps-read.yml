# Đọc cấu hình đang chạy của biglight.jp trên VPS (CHỈ ĐỌC — không sửa, không khởi động lại).
# Dùng để đối chiếu deploy/biglight-web/ trong repo với thực tế trên máy chủ.
# Chạy: gh workflow run vps-read.yml → gh run view --log
name: VPS read biglight-web (read-only)

on:
  workflow_dispatch:

concurrency:
  group: biglight-web-vps
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read config over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script: |
            echo "===== /root/biglight-web (ls)"; ls -la /root/biglight-web /root/biglight-web/nginx 2>/dev/null
            echo "===== BEGIN docker-compose.yml"; cat /root/biglight-web/docker-compose.yml; echo "===== END docker-compose.yml"
            echo "===== BEGIN nginx"; cat /root/biglight-web/nginx/default.conf 2>/dev/null || cat /root/biglight-web/nginx.conf; echo "===== END nginx"
            echo "===== container"; docker inspect biglight-web --format '{{.Created}} {{.Config.Image}} {{.State.Status}}'
            docker inspect biglight-web --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}'
            echo "===== git tại /var/www/biglight"
            cd /var/www/biglight && git -c safe.directory='*' status -sb | head -40
            echo "--- log"; git -c safe.directory='*' log --format='%h %ad %s' --date=iso -8
            echo "--- khác biệt với origin/main (chỉ tên file)"; git -c safe.directory='*' fetch -q origin 2>/dev/null || true; git -c safe.directory='*' diff --stat origin/main -- . ':!news' ':!sitemap.xml' | tail -25
            echo "--- file không theo dõi (trừ news)"; git -c safe.directory='*' status --porcelain --untracked-files=all | grep '^??' | grep -v '^?? news/' | head -40
            echo "===== kiểm trang tại chỗ"
            for u in / /index.html /about/ /.git/HEAD /build.sh; do docker exec biglight-web wget -S -q --max-redirect=0 -O /dev/null "http://127.0.0.1$u" 2>&1 | awk -v u=$u '/HTTP\//{c=$2} END{print u, c}'; done
