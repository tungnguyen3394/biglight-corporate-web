# Đọc cấu hình đang chạy của biglight.jp trên VPS (CHỈ ĐỌC — không sửa, không khởi động lại).
# Dùng để đối chiếu deploy/biglight-web/ trong repo với thực tế trên máy chủ.
# Chạy: gh workflow run vps-read.yml → gh run view --log
name: VPS read biglight-web (read-only)

on:
  workflow_dispatch:

concurrency:
  group: biglight-web-vps
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read config over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script: |
            echo "===== /root/biglight-web (ls)"; ls -la /root/biglight-web
            echo "===== BEGIN docker-compose.yml"; cat /root/biglight-web/docker-compose.yml; echo "===== END docker-compose.yml"
            echo "===== BEGIN nginx.conf"; cat /root/biglight-web/nginx.conf; echo "===== END nginx.conf"
            echo "===== container"; docker inspect biglight-web --format '{{.Created}} {{.Config.Image}} {{.State.Status}}'
            docker inspect biglight-web --format '{{range .Mounts}}{{.Source}} -> {{.Destination}} ro={{.RW}}{{"\n"}}{{end}}'
            echo "===== /var/www/biglight (cấp 1)"; ls -la /var/www/biglight
            echo "===== thư mục không có trong repo (news/uploads...)"; du -sh /var/www/biglight/* 2>/dev/null | sort -h | tail -15
            echo "===== infra compose: khối biglight-web (nếu có)"; grep -n -B2 -A14 'biglight-web' /root/infra/docker-compose.yml 2>/dev/null || echo "(không có trong /root/infra)"
            echo "===== kiểm tra trang chủ tại chỗ"; curl -s -o /dev/null -w 'local / -> %{http_code}\n' -H 'Host: biglight.jp' http://127.0.0.1:$(docker port biglight-web 80 2>/dev/null | head -1 | awk -F: '{print $NF}')/ || true
