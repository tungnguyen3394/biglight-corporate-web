# biglight.jp — nginx phục vụ HTML tĩnh trong /var/www/biglight (Caddy đứng trước, lo TLS + nén).
# Thư mục này được mount NGUYÊN THƯ MỤC vào /etc/nginx/conf.d (xem docker-compose.yml cùng cấp).
# Đổi ở đây → push → deploy-web-config.yml kiểm cú pháp, đưa lên, đo / = 200 rồi mới xong.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # ── Không phục vụ file nội bộ (2026-09-23: /.git/, build.sh, *.md, *.bak-* từng tải được công khai) ──
    # Web root là một bản checkout git + các file .bak do sửa tay để lại. Trả 404 (không 403) để khỏi
    # xác nhận là file có tồn tại. Regex đứng TRƯỚC rule 410 bên dưới vì nginx xét regex theo thứ tự.
    location ~ /\.                                   { return 404; }   # .git/, .gitignore, mọi dotfile
    location ~* \.(bak|bak-[^/]*|md|sh|json|lock)$  { return 404; }   # sao lưu tay, ghi chú, build.sh, package*.json
    location ^~ /_icon_bak/                          { return 404; }
    location ^~ /deploy/                             { return 404; }   # cấu hình nginx/compose trong repo (về VPS qua git)
    location = /_redirects                           { return 404; }   # dấu vết Netlify cũ

    # ── SEO 2026-09-23: URL cũ (site trước khi đổi) → 301 / 410 ────────────────
    # Thứ tự ưu tiên của nginx: "= /path" (khớp đúng) > "^~ /prefix/" > regex "~".
    # Các trang thật (/news/*, /service/*, /about/, /contact/…) đều là thư mục
    # có index.html → không khớp bất kỳ rule nào dưới đây, đi thẳng vào try_files.
    # /service/ chưa có trang riêng (403) → đưa về trang dịch vụ chính.
    location = /service/ { return 301 /service/tokutei-ginou/; }
    # Liên hệ / dịch vụ
    location = /contact.html  { return 301 /contact/; }
    location = /services.html { return 301 /service/tokutei-ginou/; }
    location = /our-service   { return 301 /service/tokutei-ginou/; }
    location ^~ /our-service/ { return 301 /service/tokutei-ginou/; }
    location ^~ /viec-lam-cho-tokuteigino1-2/ { return 301 /service/tokutei-ginou/; }
    # Giới thiệu công ty (tiếng Việt cũ)
    location = /company-detail.html          { return 301 /about/; }
    location = /ho-so-cong-ty.html           { return 301 /about/; }
    location = /su-menh.html                 { return 301 /about/; }
    location = /the-manh-cua-chung-toi.html  { return 301 /about/; }
    location = /gap-go-chung-toi.html        { return 301 /about/; }
    location = /about-us   { return 301 /about/; }
    location ^~ /about-us/ { return 301 /about/; }
    location = /contact-us   { return 301 /contact/; }
    location ^~ /contact-us/ { return 301 /contact/; }
    # Tuyển dụng cũ: từng tin không có trang tương đương → 410 (SEO 2026-09-24). Trước đây 301 về
    # job.biglight.jp/jobs = Google coi là soft 404, không chịu xoá khỏi index. Chỉ đường dẫn gốc
    # (không có "/" cuối) vẫn 301 sang cổng việc làm.
    location = /tuyen-dung.html            { return 410; }
    location = /tuyen-dung                 { return 301 https://job.biglight.jp/jobs; }
    location ^~ /tuyen-dung/               { return 410; }
    location = /viec-lam-cho-ky-su         { return 301 https://job.biglight.jp/jobs; }
    location ^~ /viec-lam-cho-ky-su/       { return 410; }
    location = /lam-them-arubaito          { return 301 https://job.biglight.jp/jobs; }
    location ^~ /lam-them-arubaito/        { return 410; }
    # Blog cũ: trang danh sách → お知らせ (301); từng bài cũ → 410.
    location = /blog.html { return 301 /news/; }
    location = /blog      { return 301 /news/; }
    location ^~ /blog/    {
        location ~ \.html$ { return 410; }   # /blog/<bài>.html
        return 301 /news/;                   # đường dẫn khác dưới /blog/
    }
    location = /blogs     { return 301 /news/; }
    location ^~ /blogs/   { return 410; }
    # Tài khoản của site cũ: đã bỏ hẳn
    location = /account   { return 410; }
    location ^~ /account/ { return 410; }
    # Trang lỗi của chính site (không phải URL cũ) — giữ nguyên, không 410.
    location = /404.html   { }

    # /index.html → / (chuẩn hoá URL). ★ PHẢI xét $request_uri, KHÔNG được viết
    # `location = /index.html { return 301 /; }`: chỉ thị `index` chuyển NỘI BỘ "/" thành
    # "/index.html" rồi khớp lại location này → 301 về / → lặp vô hạn (ERR_TOO_MANY_REDIRECTS,
    # sập trang chủ 2026-09-23 16:09–23:07 JST). $request_uri là URL gốc khách gõ, không đổi
    # theo chuyển nội bộ, nên "/" đi qua đây sẽ được phục vụ file bình thường.
    location = /index.html { if ($request_uri ~ "^/index.html") { return 301 /; } }

    # Mọi *.html khác ở cấp gốc = trang của site cũ → 410 (đã gỡ vĩnh viễn).
    # Chỉ bắt "/<tên>.html" (không có thư mục con) để không đụng /news/…/index.html.
    location ~ ^/[^/]+\.html$ { return 410; }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # Mọi `return 410;` ở trên → trang HTML ngắn + noindex. Viết thẳng ở đây, không cần file trong
    # web root. add_header phải có "always", mặc định nginx bỏ header khi mã là lỗi.
    error_page 410 @gone;
    location @gone {
        default_type text/html;
        charset utf-8;
        add_header X-Robots-Tag "noindex" always;
        return 410 '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>このページは削除されました | BIGLIGHT株式会社</title><style>body{font-family:sans-serif;color:#1f2a3a;text-align:center;padding:80px 16px}h1{font-size:22px;color:#0b3d91}a{color:#1e6fd6}</style></head><body><h1>このページは削除されました</h1><p>お探しのページは削除されたため、現在はご覧いただけません。</p><p><a href="/">トップページへ戻る</a></p></body></html>';
    }
}
