# new.biglight.jp — BẢN XEM TRƯỚC giao diện mới (nhánh `redesign`, thư mục redesign/).
# Tách hẳn khỏi biglight.jp: compose riêng (/root/biglight-web-new), container riêng, web root riêng
# (/var/www/biglight-new). Web chính biglight.jp KHÔNG bị đụng.
#
# Giai đoạn xem trước: X-Robots-Tag noindex → Google không lập chỉ mục (tránh trùng nội dung với
# biglight.jp). Trang đã có đủ canonical/OGP/JSON-LD/sitemap trỏ về https://biglight.jp — khi chuyển
# sang tên miền chính chỉ cần bỏ dòng noindex.
services:
  biglight-web-new:
    image: nginx:alpine
    container_name: biglight-web-new
    restart: unless-stopped
    volumes:
      - /var/www/biglight-new:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    labels:
      caddy: new.biglight.jp
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.encode: zstd gzip
      caddy.header.X-Robots-Tag: "\"noindex, nofollow\""   # bẫy: giá trị có dấu phẩy phải bọc "\"...\""
      caddy.header.Strict-Transport-Security: "max-age=31536000"
      caddy.header.?X-Content-Type-Options: nosniff
      caddy.header.?X-Frame-Options: SAMEORIGIN
      caddy.header.?Referrer-Policy: strict-origin-when-cross-origin
    networks: [web]

networks:
  web:
    external: true
