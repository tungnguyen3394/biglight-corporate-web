# biglight.jp — giao diện mới (redesign/build.cjs → /var/www/biglight-new), từ 2026-10-10.
#
# Hai web root:
#   /usr/share/nginx/html = bản mới (ưu tiên)
#   /usr/share/nginx/old  = web cũ /var/www/biglight (CHỈ ĐỌC, không xoá — admin.biglight.jp vẫn ghi /news/ vào đó)
# Cái gì bản mới không có (PDF /assets/, ảnh bài tin /assets/uploads/, /optout/ trong email bán hàng, bài tin mới
# chưa kịp build lại…) thì lấy từ web cũ. Trang cũ đã có trang mới tương ứng → 301 (bên dưới), không hiện giao diện cũ.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    # HTML luôn kiểm bản mới; CSS/JS/ảnh có add_header riêng (cache 30 ngày, CSS/JS mang ?v=)
    add_header Cache-Control "no-cache" always;

    # ── không lộ file nội bộ (web cũ là một checkout git + file .bak sửa tay) ──
    location ~ /\.                                  { return 404; }
    location ~* \.(?:md|sh|cjs|json|lock|bak)$      { return 404; }
    location ~* \.bak-[^/]*$                        { return 404; }
    location ^~ /_icon_bak/                         { return 404; }
    location ^~ /deploy/                            { return 404; }
    location ^~ /redesign/                          { return 404; }
    location = /_redirects                          { return 404; }

    # ── trang cũ → trang mới (301) ──
    location = /faq/      { return 301 /service/tokutei-ginou/#faq; }
    location = /faq       { return 301 /service/tokutei-ginou/#faq; }
    location = /flow/     { return 301 /service/; }
    location = /sdgs/     { return 301 /about/sdgs/; }
    location = /sdgs      { return 301 /about/sdgs/; }
    location ^~ /service/jinzai-shoukai/                { return 301 /service/engineer/; }
    location ^~ /service/teichaku/                      { return 301 /service/tokutei-ginou/; }
    location ^~ /service/tokutei-ginou/kogyo-seihin/    { return 301 /service/field/kogyo/; }
    location ^~ /service/tokutei-ginou/kensetsu/        { return 301 /service/field/kensetsu/; }
    location ^~ /service/tokutei-ginou/inshokuryohin/   { return 301 /service/field/inshoku/; }
    location ^~ /service/tokutei-ginou/gaishoku/        { return 301 /service/field/gaishoku/; }
    location ~ ^/news/(?:tag|category|page|author)/     { return 301 /news/; }

    # ── URL của site đời trước nữa (giữ y như web cũ, SEO 2026-09-23/24) ──
    location = /contact.html  { return 301 /contact/; }
    location = /services.html { return 301 /service/tokutei-ginou/; }
    location = /our-service   { return 301 /service/tokutei-ginou/; }
    location ^~ /our-service/ { return 301 /service/tokutei-ginou/; }
    location ^~ /viec-lam-cho-tokuteigino1-2/ { return 301 /service/tokutei-ginou/; }
    location = /company-detail.html          { return 301 /about/; }
    location = /ho-so-cong-ty.html           { return 301 /about/; }
    location = /su-menh.html                 { return 301 /about/; }
    location = /the-manh-cua-chung-toi.html  { return 301 /about/; }
    location = /gap-go-chung-toi.html        { return 301 /about/; }
    location = /about-us     { return 301 /about/; }
    location ^~ /about-us/   { return 301 /about/; }
    location = /contact-us   { return 301 /contact/; }
    location ^~ /contact-us/ { return 301 /contact/; }
    location = /tuyen-dung.html            { return 410; }
    location = /tuyen-dung                 { return 301 https://job.biglight.jp/jobs; }
    location ^~ /tuyen-dung/               { return 410; }
    location = /viec-lam-cho-ky-su         { return 301 https://job.biglight.jp/jobs; }
    location ^~ /viec-lam-cho-ky-su/       { return 410; }
    location = /lam-them-arubaito          { return 301 https://job.biglight.jp/jobs; }
    location ^~ /lam-them-arubaito/        { return 410; }
    location = /blog.html { return 301 /news/; }
    location = /blog      { return 301 /news/; }
    location ^~ /blog/    {
        location ~ \.html$ { return 410; }
        return 301 /news/;
    }
    location = /blogs     { return 301 /news/; }
    location ^~ /blogs/   { return 410; }
    location = /account   { return 410; }
    location ^~ /account/ { return 410; }

    location = /404.html { internal; }

    # /xxx/index.html → /xxx/ (một URL mỗi trang). Xét $request_uri để không lặp với `index`
    # (sự cố 23/9: `location = /index.html { return 301 /; }` làm trang chủ lặp 301).
    location ~ ^(.*/)index\.html$ {
        if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") { return 301 $1$2; }
        try_files $uri @old;
    }
    # (đứng TRƯỚC rule 410 dưới đây: nginx xét regex theo thứ tự, "/" → /index.html nội bộ)

    # Mọi "/<tên>.html" khác ở cấp gốc = trang site đời trước → 410
    location ~ ^/[^/]+\.html$ { return 410; }

    location / {
        try_files $uri $uri/ @old;
    }

    # tài nguyên tĩnh: cache dài (CSS/JS mang ?v=)
    location ~* \.(?:css|js|jpg|jpeg|png|webp|gif|svg|ico|woff2?|pdf|mp4)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @old;
    }

    location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
    location = /robots.txt  { default_type text/plain; try_files $uri =404; }

    # web cũ — chỉ phần bản mới không có
    location @old {
        root /usr/share/nginx/old;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;

    error_page 410 @gone;
    location @gone {
        default_type text/html;
        add_header X-Robots-Tag "noindex" always;
        return 410 '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>このページは削除されました | BIGLIGHT株式会社</title><style>body{font-family:sans-serif;color:#1f2a3a;text-align:center;padding:80px 16px}h1{font-size:22px;color:#0b3d91}a{color:#1e6fd6}</style></head><body><h1>このページは削除されました</h1><p>お探しのページは削除されたため、現在はご覧いただけません。</p><p><a href="/">トップページへ戻る</a></p></body></html>';
    }
}
