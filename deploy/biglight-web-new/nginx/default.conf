# new.biglight.jp — trang tĩnh sinh từ redesign/build.cjs (URL dạng thư mục: /about/ → /about/index.html)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;   # Location tương đối → giữ https của Caddy

    # /xxx/index.html → /xxx/ (một URL duy nhất cho mỗi trang). Xét $request_uri để không lặp với `index`.
    location ~ ^(.*/)index\.html$ {
        if ($request_uri ~ "^(.*/)index\.html(\?.*)?$") { return 301 $1$2; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # tài nguyên tĩnh: cache dài (tên file đổi khi nội dung đổi thì nâng ?v=)
    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
    location = /robots.txt  { default_type text/plain; try_files $uri =404; }

    # không lộ file ẩn / file nguồn
    location ~ /\. { return 404; }
    location ~* \.(?:md|sh|cjs|json|bak)$ { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
